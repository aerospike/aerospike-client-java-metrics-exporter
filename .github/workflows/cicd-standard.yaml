name: CI/CD (artifacts)

# Run manually with a commit on main to release it: builds that commit, publishes it to JFrog as the
# VERSION file's version, creates its release bundle, promotes it to DEV and tags the commit v<VERSION>.
# Nothing is published on pushes or pull requests; ci.yaml builds and tests those.
# An engineer promotes DEV to TEST, then TEST to STAGE, with promote-release-bundle.yaml.
# A product manager promotes STAGE to PROD in the JFrog UI. The repo token cannot do that.

on:
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit on main to release
        required: true
        type: string

permissions:
  contents: read

# One release at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # CLIENT-OM-330-client-metrics, the same pin as ci.yaml and e2e.yaml. Clear it once a released
  # client has the metrics exporter API; releases refuse to build while it is set.
  CLIENT_REF: d1105aaed81e3c82a7bd5cb0f0fb4f352cd576c0

jobs:
  version:
    name: Version
    # Publishing needs the JFrog OIDC trust (set through the JFROG_* repository variables).
    if: vars.JFROG_PROJECT != '' && vars.JFROG_OIDC_PROVIDER != '' && vars.JFROG_OIDC_AUDIENCE != ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      client-ref: ${{ steps.version.outputs.client-ref }}
      source-sha: ${{ steps.version.outputs.source-sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release-sha }}
          # The release checks need main's history and the existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit and compute the version
        id: version
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::release-sha must be a commit hash, got: ${RELEASE_SHA}"
            exit 1
          fi
          source_sha=$(git rev-parse --verify "${RELEASE_SHA}^{commit}")
          if ! git merge-base --is-ancestor "${source_sha}" origin/main; then
            echo "::error::${source_sha} is not on main"
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::v${version} is already released. Bump the VERSION file first."
            exit 1
          fi
          if [[ -n "${CLIENT_REF}" ]]; then
            echo "::error::Release ${version} would depend on the unreleased client commit ${CLIENT_REF}." \
              "Set aerospike.client.version in pom.xml to a released client and clear CLIENT_REF first."
            exit 1
          fi
          echo "Releasing ${source_sha} as ${version}"
          {
            echo "version=${version}"
            echo "client-ref=${CLIENT_REF}"
            echo "source-sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
    with:
      # Must match the ref in the uses: line above.
      gh-workflows-ref: 308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-build-name: aerospike-client-java-metrics-exporter
      oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER }}
      oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
      version: ${{ needs.version.outputs.version }}
      build-type: release
      gh-source-ref: ${{ needs.version.outputs.source-sha }}
      gh-artifact-directory: dist
      build-script-path: .github/scripts/build-artifacts.sh
      build-env: VERSION=${{ needs.version.outputs.version }};CLIENT_REF=${{ needs.version.outputs.client-ref }}
      setup-java: true
      java-version: "21"
      jar-group-id: com.aerospike
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  release-bundle:
    name: Release bundle
    needs: [version, publish]
    permissions:
      contents: read
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
    with:
      # Must match the ref in the uses: line above.
      gh-workflows-ref: 308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-bundle-name: aerospike-client-java-metrics-exporter
      jf-build-names: ${{ needs.publish.outputs.jf-build-name }}:${{ needs.publish.outputs.jf-build-id }}
      version: ${{ needs.version.outputs.version }}
      jf-bundle-revision: auto
      # Uploaded by the publish deploy job under its default name; marks the bundle as a multi-module Maven release.
      gh-bundle-metadata-artifact-name: bundle-metadata
      oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER }}
      oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

  promote-dev:
    name: Promote to DEV
    needs: [version, release-bundle]
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_promote-release-bundle.yaml@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
    with:
      # Must match the ref in the uses: line above.
      gh-workflows-ref: 308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-bundle-name: aerospike-client-java-metrics-exporter
      version: ${{ needs.release-bundle.outputs.bundle-version }}
      target-stage: DEV
      oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER }}
      oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

  tag:
    name: Tag the release
    needs: [version, release-bundle]
    # Tags as soon as the release is published, so a failed promotion cannot lead to the version being released twice.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ needs.version.outputs.source-sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SOURCE_SHA}"
          echo "Tagged ${SOURCE_SHA} as ${TAG}"
