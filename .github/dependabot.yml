version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - java
    ignore:
      # Published clients lack the metrics exporter API; CI builds it from a pinned commit.
      - dependency-name: com.aerospike:aerospike-client-jdk21

  - package-ecosystem: docker-compose
    directory: /examples/stack
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

