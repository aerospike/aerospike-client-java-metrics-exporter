aerospike_metrics_exporter:
  snapshot_stale_timeout: 30s

  otel:
    service_name: aerospike-client-metrics-example
    endpoint: http://localhost:4317
    protocol: grpc
    timeout: 3s
    export_interval: 5s
    compression: none
    temporality: cumulative

  prometheus:
    bind_address: 0.0.0.0
    port: 9146
    path: /metrics
    http_timeout: 5s
    tls:
      enabled: false
      client_auth: none
