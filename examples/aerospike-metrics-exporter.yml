aerospike_metrics_exporter:
  # "auto" starts at 90 seconds and adapts to three observed intervals.
  snapshot_stale_timeout: auto

  otel:
    service_name: aerospike-client-example
    endpoint: http://localhost:4317
    protocol: grpc
    timeout: 10s
    export_interval: 60s
    compression: none
    temporality: cumulative
    headers: {}

  prometheus:
    bind_address: 0.0.0.0
    port: 9146
    path: /metrics
    http_timeout: 10s
    tls:
      enabled: false
      client_auth: none
